<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b43"><title>Michael · Crystal Escape</title><link rel="stylesheet" href="site.css"></head><body><nav><a href="../" data-t="navHome"></a><div class="links"><a href="./" data-t="navHub"></a><a href="play.html" data-t="navPlay"></a><a href="parents.html" data-t="navParents"></a><a href="review.html" data-t="navReview"></a><button id="language"></button></div></nav><main><div class="eyebrow" data-t="eyebrow"></div><h1 data-t="heading"></h1><p data-t="opening"></p><section class="box steps"><article><div><h3 data-t="s1"></h3><p data-t="s1t"></p></div></article><article><div><h3 data-t="s2"></h3><p data-t="s2t"></p></div></article><article><div><h3 data-t="s3"></h3><p data-t="s3t"></p></div></article><article><div><h3 data-t="s4"></h3><p data-t="s4t"></p></div></article></section><h2 data-t="prompt"></h2><p class="notice" data-t="promptText"></p><a class="btn" href="play.html" data-t="play"></a><a class="btn secondary" href="review.html" data-t="review"></a><h2 data-t="privacy"></h2><p data-t="privacyText"></p><h2 data-t="limitation"></h2><p data-t="limitationText"></p></main><footer data-t="footer"></footer><script>const words={"navHome": ["全部学生作品", "All student works"], "navHub": ["Michael 的作品", "Michael’s project"], "navPlay": ["玩游戏", "Play"], "navParents": ["家长指南", "For parents"], "navReview": ["家庭测评", "Home review"], "footer": ["课堂创意与测评：Michael。AI 辅助实现；课后版 1.1 · 2026-09-20。公开页面只使用名字，不包含详细课堂评估。", "Game idea and classroom review: Michael. AI-assisted implementation; after-class 1.1 · 20 September 2026. Public pages use first names only and do not include detailed classroom assessments."], "play": ["开始玩课后版", "Play the after-class edition"], "review": ["给游戏做测评", "Review the game"], "parents": ["给家长的展示指南", "Parent showcase guide"], "localOnly": ["这份反馈只保存在当前浏览器，没有发送到老师或服务器。请复制报告或截图，通过平时与老师联系的方式发送。", "Feedback stays in this browser. It is not sent to a teacher or server. Copy the report or take a screenshot, then send it through your usual teacher contact channel."], "pageTitle": ["Michael 的作品 · 家长指南", "Michael’s Game · Parent Guide"], "eyebrow": ["家庭展示 · 不需要安装", "FAMILY SHOWCASE · NO INSTALLATION"], "heading": ["让孩子介绍自己的作品。", "Let the creator do the talking."], "opening": ["这次的重点不只是“会玩游戏”，而是把想法说出来、试玩自己的作品，再提出一个能够验证的改进。Michael 决定做骷髅追逐的 3D 跑酷，并在试玩后选择提高玩家速度。", "The goal is more than playing a game: describe an idea, try the result, and propose a change that can be tested. Michael chose a 3D obstacle course with a skeleton chase, then requested a faster player after testing."], "s1": ["打开与准备", "Open and prepare"], "s1t": ["用 iPad Safari 打开课后版，建议横屏。选中文或英文，点“开始”。不需要下载应用、登录账号或连接老师的电脑。游戏包含卡通骷髅追逐，介意追逐情节时可先由家长查看。", "Open the after-class edition in Safari on an iPad, preferably in landscape. Choose Chinese or English and press Start. No app, account or connection to the teacher’s computer is needed. It contains cartoon skeleton chases; a parent can preview it first."], "s2": ["让 Michael 教你玩", "Ask Michael to teach you"], "s2t": ["请他说清楚三件事：要收集什么、怎样操作、怎样获胜。左手摇杆控制移动；右手跳跃。至少 8 颗水晶加抵达出口才通关；掉落、被抓、超时会结束一局。", "Ask him to explain three things: what to collect, how to control the player, and how to win. Use the left stick to move and the right button to jump. Win by collecting at least 8 crystals and reaching the exit. Falling, being caught or running out of time ends a run."], "s3": ["只比较一个主要问题", "Compare one main change"], "s3t": ["这次先问：“跑快一点以后，是更容易逃开，还是更容易冲过平台？”再试试能否一边移动一边跳。无需为了交作业强行通关。暂停按钮可以随时停下。", "First ask: “Does the faster player make escaping easier, or make it easier to overshoot platforms?” Then try moving and jumping together. There is no need to force a win to complete the review. Pause whenever needed."], "s4": ["保留一条清楚的反馈", "Keep one clear piece of feedback"], "s4t": ["请孩子说：我在什么位置做了什么、发生了什么、我想改什么、改好后怎样判断有效。测评页会保留最近一局结果，并可复制文字；也可以录一小段游戏画面。不必拍孩子的脸或写全名。", "Ask the child to say where they were, what they did, what happened, what they would change, and how they would check it. The review page can show the latest completed run and copy a written report. A short gameplay clip also works. No face recording or full name is needed."], "prompt": ["孩子可以这样开头", "A starting sentence for Michael"], "promptText": ["“我做了一个 3D 跑酷游戏。我最喜欢……因为……。我发现……。下一版我建议……。我会通过……来测试它。”", "“I made a 3D obstacle game. My favourite part is … because … . I noticed … . For the next version I suggest … . I will test it by … .”"], "privacy": ["数据与分享", "Data and sharing"], "privacyText": ["游戏无需登录。最近一局与测评草稿只存当前浏览器，可在测评页清除；不会自动上传。公开 HUB 不包含详细课堂评估，反馈请私下交给老师。静态页面由 GitHub Pages 提供。", "The game needs no login. The last run and review draft are stored only in this browser and can be cleared on the review page; they are not uploaded automatically. The public hub does not contain detailed classroom assessments. Send feedback privately to the teacher. GitHub Pages hosts the static website."], "limitation": ["测试边界", "Testing boundary"], "limitationText": ["已完成的自动检查会列在工程记录中；这不等同于已经在你的实体 iPad 上测试，也不代表孩子已认可难度。遇到黑屏、卡顿或按键问题，请记录设备型号、浏览器和出问题的步骤。", "Completed automated checks are listed in the engineering record. They do not mean this exact physical iPad has been tested, or that the child has approved the difficulty. For a blank screen, slow rendering or control problem, record the device, browser and steps that produced it."]};let L='en';try{L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('studentWorksLang')||(navigator.language.startsWith('zh')?'zh':'en');}catch{}if(!['zh','en'].includes(L))L='en';function tx(k){return(words[k]||[k,k])[L==='zh'?0:1];}function apply(){document.documentElement.lang=L==='zh'?'zh-CN':'en';document.title=tx('pageTitle');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tx(e.dataset.t));document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=tx(e.dataset.placeholder));document.querySelectorAll('[data-alt]').forEach(e=>e.alt=tx(e.dataset.alt));document.getElementById('language').textContent=L==='zh'?'EN / English':'中文 / ZH';document.getElementById('language').setAttribute('aria-label',L==='zh'?'Switch to English':'切换到中文');window.dispatchEvent(new Event('siteLanguageChange'));}document.getElementById('language').onclick=()=>{L=L==='zh'?'en':'zh';try{localStorage.setItem('studentWorksLang',L);}catch{}apply();};apply();</script></body></html>
