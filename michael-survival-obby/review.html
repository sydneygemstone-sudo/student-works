<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b43"><title>Michael · Crystal Escape</title><link rel="stylesheet" href="site.css"></head><body><nav><a href="../" data-t="navHome"></a><div class="links"><a href="./" data-t="navHub"></a><a href="play.html" data-t="navPlay"></a><a href="parents.html" data-t="navParents"></a><a href="review.html" data-t="navReview"></a><button id="language"></button></div></nav><main><div class="eyebrow" data-t="eyebrow"></div><h1 data-t="heading"></h1><p data-t="intro"></p><p class="notice" data-t="localOnly"></p><section class="box"><h3 data-t="lastTitle"></h3><p id="last-run"></p><form id="review-form"><label for="device" data-t="device"></label><input id="device" maxlength="80" data-placeholder="deviceHelp"><label for="liked" data-t="liked"></label><textarea id="liked" maxlength="1600" data-placeholder="likedHelp"></textarea><label for="problem" data-t="problem"></label><textarea id="problem" maxlength="1600" data-placeholder="problemHelp"></textarea><label for="change" data-t="change"></label><textarea id="change" maxlength="1600" data-placeholder="changeHelp"></textarea><label for="proof" data-t="proof"></label><textarea id="proof" maxlength="1600" data-placeholder="proofHelp"></textarea><label for="speed" data-t="speed"></label><select id="speed"><option value="0" data-t="speed0"></option><option value="1" data-t="speed1"></option><option value="2" data-t="speed2"></option><option value="3" data-t="speed3"></option></select><label for="controls" data-t="controls"></label><select id="controls"><option value="0" data-t="controls0"></option><option value="1" data-t="controls1"></option><option value="2" data-t="controls2"></option><option value="3" data-t="controls3"></option></select><p><button class="btn" type="submit" data-t="generate"></button><button class="btn secondary" type="button" id="copy" data-t="copy"></button></p><label for="report" data-t="report"></label><textarea id="report" class="report" readonly></textarea><p id="feedback-status" role="status"></p><button type="button" class="btn secondary" id="clear" data-t="clear"></button></form></section></main><footer data-t="footer"></footer><script>const words={"navHome": ["全部学生作品", "All student works"], "navHub": ["Michael 的作品", "Michael’s project"], "navPlay": ["玩游戏", "Play"], "navParents": ["家长指南", "For parents"], "navReview": ["家庭测评", "Home review"], "footer": ["课堂创意与测评：Michael。AI 辅助实现；课后版 1.1 · 2026-09-20。公开页面只使用名字，不包含详细课堂评估。", "Game idea and classroom review: Michael. AI-assisted implementation; after-class 1.1 · 20 September 2026. Public pages use first names only and do not include detailed classroom assessments."], "play": ["开始玩课后版", "Play the after-class edition"], "review": ["给游戏做测评", "Review the game"], "parents": ["给家长的展示指南", "Parent showcase guide"], "localOnly": ["这份反馈只保存在当前浏览器，没有发送到老师或服务器。请复制报告或截图，通过平时与老师联系的方式发送。", "Feedback stays in this browser. It is not sent to a teacher or server. Copy the report or take a screenshot, then send it through your usual teacher contact channel."], "pageTitle": ["Michael 的作品 · 家庭测评", "Michael’s Game · Home Review"], "eyebrow": ["试玩 → 观察 → 建议 → 再试", "PLAY → NOTICE → SUGGEST → TEST"], "heading": ["把“好玩”说具体。", "Tell us what made it fun."], "intro": ["先说一个喜欢的部分和一个想改的地方。你不需要通关，也不需要写很长。", "Start with one thing you liked and one thing you would change. You do not need to win or write a long report."], "lastTitle": ["最近完成的一局", "Latest completed run"], "noRun": ["这个浏览器还没有完成一局。可以直接填写观察。", "No completed run is stored in this browser yet. You can still write your observations."], "device": ["使用什么设备？", "Which device did you use?"], "deviceHelp": ["例如 iPad、iPhone 或电脑；不需要填姓名。", "For example iPad, iPhone or computer; no name is needed."], "liked": ["1. 我最喜欢什么？为什么？", "1. What did I like most, and why?"], "likedHelp": ["我喜欢……，因为……", "I liked … because …"], "problem": ["2. 我在哪里遇到了什么问题？", "2. Where did I notice a problem?"], "problemHelp": ["在哪一段？你按了什么？实际发生了什么？", "Which part? What did you press? What happened?"], "change": ["3. 下一版我想改什么？", "3. What would I change next?"], "changeHelp": ["先提一个具体的改变。", "Choose one specific change."], "proof": ["4. 改好后怎样测试？", "4. How would I check the change?"], "proofHelp": ["我会再试……，如果……就说明有效。", "I will try … again. It works if …"], "speed": ["这次玩家速度感觉怎样？", "How does the player speed feel?"], "speed0": ["请选择", "Choose one"], "speed1": ["太慢", "Too slow"], "speed2": ["合适", "About right"], "speed3": ["太快，容易冲过头", "Too fast; I overshoot"], "controls": ["能一边移动一边跳吗？", "Can you move and jump together?"], "controls0": ["请选择", "Choose one"], "controls1": ["可以", "Yes"], "controls2": ["还需要练习", "I need more practice"], "controls3": ["操作有问题", "There is a control problem"], "generate": ["生成报告并保存草稿", "Create report and save draft"], "copy": ["复制报告", "Copy report"], "clear": ["清除本机草稿与成绩", "Clear local draft and run"], "report": ["可复制的测评报告", "Report to copy"], "saved": ["已保存在当前浏览器，尚未发送。", "Saved in this browser. Not sent."], "notSaved": ["浏览器不允许保存。请复制下面的报告。", "This browser could not save the draft. Copy the report below."], "copied": ["报告已复制；请通过平时联系老师的方式发送。", "Report copied. Send it through your usual teacher contact channel."], "copyFallback": ["请长按或选中下面的文字，手动复制。", "Select or long-press the report below and copy it manually."], "cleared": ["当前浏览器中的草稿与最近一局已清除。", "The draft and latest run have been cleared from this browser."], "won": ["成功逃生", "Escaped"], "lost": ["本局结束，继续练习", "Run ended; keep practising"], "run": ["版本 {v} · {outcome} · {n} 颗水晶 · 用时 {s} 秒", "Version {v} · {outcome} · {n} crystals · {s} seconds"]};let L='en';try{L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('studentWorksLang')||(navigator.language.startsWith('zh')?'zh':'en');}catch{}if(!['zh','en'].includes(L))L='en';function tx(k){return(words[k]||[k,k])[L==='zh'?0:1];}function apply(){document.documentElement.lang=L==='zh'?'zh-CN':'en';document.title=tx('pageTitle');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tx(e.dataset.t));document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=tx(e.dataset.placeholder));document.querySelectorAll('[data-alt]').forEach(e=>e.alt=tx(e.dataset.alt));document.getElementById('language').textContent=L==='zh'?'EN / English':'中文 / ZH';document.getElementById('language').setAttribute('aria-label',L==='zh'?'Switch to English':'切换到中文');window.dispatchEvent(new Event('siteLanguageChange'));}document.getElementById('language').onclick=()=>{L=L==='zh'?'en':'zh';try{localStorage.setItem('studentWorksLang',L);}catch{}apply();};apply();
const fields=['device','liked','problem','change','proof','speed','controls'];let lastRun=null;
try{lastRun=JSON.parse(localStorage.getItem('michaelLastRun'));const draft=JSON.parse(localStorage.getItem('michaelReviewDraft'));if(draft)for(const f of fields)if(typeof draft[f]==='string')document.getElementById(f).value=draft[f];}catch{}
function resultText(){if(!lastRun)return tx('noRun');return tx('run').replace('{v}',lastRun.version||'1.1.0').replace('{outcome}',tx(lastRun.outcome==='won'?'won':'lost')).replace('{n}',Number(lastRun.crystals)||0).replace('{s}',Number(lastRun.seconds)||0);}
function report(){let lines=['MICHAEL · CRYSTAL ESCAPE · 1.1.0',resultText()];for(const f of fields){const el=document.getElementById(f);lines.push(tx(f)+': '+(el.tagName==='SELECT'?tx(f+el.value):el.value.trim()));}lines.push(tx('localOnly'));return lines.join('\n\n');}
function updateLast(){document.getElementById('last-run').textContent=resultText();if(document.getElementById('report').value)document.getElementById('report').value=report();}
updateLast();window.addEventListener('siteLanguageChange',updateLast);
document.getElementById('review-form').onsubmit=e=>{e.preventDefault();const draft=Object.fromEntries(fields.map(f=>[f,document.getElementById(f).value]));document.getElementById('report').value=report();try{localStorage.setItem('michaelReviewDraft',JSON.stringify(draft));document.getElementById('feedback-status').textContent=tx('saved');}catch{document.getElementById('feedback-status').textContent=tx('notSaved');}};
document.getElementById('copy').onclick=async()=>{const el=document.getElementById('report');el.value=report();try{await navigator.clipboard.writeText(el.value);document.getElementById('feedback-status').textContent=tx('copied');}catch{el.focus();el.select();document.getElementById('feedback-status').textContent=tx('copyFallback');}};
document.getElementById('clear').onclick=()=>{try{localStorage.removeItem('michaelReviewDraft');localStorage.removeItem('michaelLastRun');}catch{}for(const f of fields)document.getElementById(f).value=['speed','controls'].includes(f)?'0':'';lastRun=null;document.getElementById('report').value='';updateLast();document.getElementById('feedback-status').textContent=tx('cleared');};
</script></body></html>
