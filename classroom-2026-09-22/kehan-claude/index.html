<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05060f; }
  body { font-family:"Trebuchet MS","PingFang SC",system-ui,sans-serif; color:#fff;
         user-select:none; -webkit-user-select:none; touch-action:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #boot { position:fixed; inset:0; z-index:99; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:18px; background:#05060f; }
  #boot.gone { display:none; }
  #boot .t { font-size:clamp(20px,5vw,30px); letter-spacing:3px;
             color:#7fd8ff; text-shadow:0 0 24px rgba(90,200,250,.7); }
  #boot .s { font-size:14px; opacity:.6; }
  #boot .bar { width:min(320px,70vw); height:6px; border-radius:3px; background:rgba(255,255,255,.14); overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:30%; border-radius:3px;
                 background:linear-gradient(90deg,#5ac8fa,#34d3a0); animation:slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0%{margin-left:-30%} 100%{margin-left:100%} }
  #fatal { position:fixed; inset:0; z-index:100; display:none; padding:8vw;
           background:#120508; color:#ffb4b4; font-size:14px; line-height:1.7; overflow:auto; }
</style>
