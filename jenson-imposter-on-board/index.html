<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚀 Jenson: Imposter on Board</title>
<style>
:root{
  --bg:#0b1026;--panel:#131a38;--panel2:#0e1430;--neon:#3ff9c8;--neon2:#6fd7ff;
  --danger:#ff5d73;--warn:#ffd166;--text:#eaf2ff;--muted:#8ea3c8;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"Baloo 2","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
#title{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 100% at 50% 0%,#1a2452 0%,#0b1026 62%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;overflow:hidden}
#titleCv{position:absolute;inset:0;width:100%;height:100%}
#title .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
#title h1{font-size:clamp(30px,6.5vw,66px);margin:0;letter-spacing:2px;line-height:1.15;
  text-shadow:0 0 22px rgba(63,249,200,.6),0 5px 0 #0a0f22}
#title h1 span{color:var(--neon)}
#title .sub{color:#c6d6f5;font-size:clamp(13px,2.1vw,18px);max-width:640px;line-height:1.65;font-weight:600}
.bigBtn{cursor:pointer;border:none;border-radius:18px;padding:16px 46px;font-size:23px;font-weight:900;font-family:inherit;
  color:#04211a;background:linear-gradient(180deg,#5cffd4,#25c99b);box-shadow:0 7px 0 #128a68,0 0 26px rgba(63,249,200,.5);transition:transform .06s}
.bigBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #128a68}
.bigBtn.red{background:linear-gradient(180deg,#ff8ba0,#ff5d73);color:#3a0512;box-shadow:0 7px 0 #a12338,0 0 26px rgba(255,93,115,.45)}
.bigBtn.gray{background:linear-gradient(180deg,#9db4d8,#7387ab);color:#101828;box-shadow:0 7px 0 #46557a}
.pillBtn{cursor:pointer;border:2px solid #33447c;background:#0c1230;color:var(--text);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:800;font-family:inherit}
#title .hint{font-size:13.5px;color:var(--muted)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#182048,#111737);
  border-bottom:2px solid #223063;flex-wrap:wrap}
#dayPill{background:#0c1230;border:2px solid var(--neon2);color:var(--neon2);padding:5px 12px;border-radius:999px;font-weight:900;font-size:15px}
#clockPill{background:#0c1230;border:2px solid #33447c;color:var(--warn);padding:5px 12px;border-radius:999px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
#statusPill{padding:5px 10px;border-radius:999px;font-weight:800;font-size:13.5px;background:#0c1230;border:2px solid #345}
#crewStrip{display:flex;gap:6px;margin-left:auto;align-items:center}
.mini{width:38px;height:38px;border-radius:11px;background:#0c1230;border:2px solid #26335f;display:grid;place-items:center;position:relative;overflow:hidden}
.mini.gone{filter:grayscale(1) brightness(.45)}
.mini.gone::after{content:"💀";position:absolute;inset:0;display:grid;place-items:center;font-size:19px}
.hbtn{cursor:pointer;border:2px solid #2c3a6b;background:#0c1230;color:var(--text);border-radius:12px;padding:7px 11px;font-size:16px;font-family:inherit;font-weight:800}
main{flex:1;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;display:none;flex-direction:column;padding:10px;gap:8px}
.panel.on{display:flex;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.985);opacity:.4}to{transform:scale(1);opacity:1}}
h2.pt{font-size:18px;margin:0;font-weight:900;color:var(--neon);letter-spacing:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2.pt .tip{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}
canvas{display:block;border-radius:16px}
#shipWrap{flex:1;position:relative;min-height:0}
#shipCv{width:100%;height:100%;touch-action:none}
#actBtn{position:absolute;right:16px;bottom:16px;display:none;flex-direction:column;align-items:center;justify-content:center;
  width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:13.5px;line-height:1.25;
  color:#2a1200;background:radial-gradient(circle at 35% 30%,#ffe08a,#ffb020);box-shadow:0 6px 0 #a56a00,0 0 22px rgba(255,208,88,.45)}
#actBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a56a00}
#actBtn .ic{font-size:30px}
#hintBar{font-size:12px;color:var(--muted);text-align:center}
#timeBarWrap{flex:1;min-width:110px;height:12px;background:#0c1230;border:2px solid #26335f;border-radius:999px;overflow:hidden}
#timeBar{height:100%;width:0%;background:linear-gradient(90deg,#25c99b,#ffd166)}
#shipHud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#cctvLayout{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
#cctvTop{flex:1;position:relative;min-height:0}
#cctvCv{position:absolute;inset:0;width:100%;height:100%}
#cctvStrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
#cctvLog{height:104px;overflow:auto;background:#04140f;border:2px solid #14523d;border-radius:12px;padding:8px 10px;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.8;color:#7de8b4}
#cctvLog .t{color:#3ddc97;opacity:.85;margin-right:6px}
#cctvLocked{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,8,20,.92);z-index:2;border-radius:16px;text-align:center;padding:20px}
#cctvLocked.on{display:grid}
#cctvLocked .lk{font-size:52px}
#cctvLocked p{color:var(--warn);font-weight:800;font-size:16px;line-height:1.7;margin:6px 0 0}
.scrollY{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
#manualGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.mcard{background:var(--panel);border:2px solid #26335f;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center}
.mcard img,.bubble img{width:58px;height:58px;flex:0 0 auto}
.mcard .nm{font-size:17px;font-weight:900}
.mcard .rt{font-size:13px;color:var(--muted);line-height:1.65;margin-top:3px}
.mcard .rt b{color:var(--neon2)}
.talkTip{font-size:13px;color:var(--muted);background:var(--panel2);border-left:4px solid var(--neon);padding:9px 12px;border-radius:0 12px 12px 0;line-height:1.6}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble img{width:44px;height:44px}
.bubble .txt{flex:1;background:var(--panel);border:2px solid #26335f;border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.6}
.bubble .who2{font-weight:900;margin-bottom:3px;font-size:14px}
.bubble.dead .txt{opacity:.45}
.dayTag{font-weight:900;color:var(--neon2);font-size:14px;margin-top:4px}
#meetGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.mcell{cursor:pointer;background:var(--panel2);border:3px solid #2c3a6b;border-radius:18px;padding:12px 8px;text-align:center;transition:.15s;font-family:inherit;color:var(--text);font-weight:900}
.mcell:hover{border-color:var(--warn);transform:translateY(-3px)}
.mcell.sel{border-color:var(--danger);box-shadow:0 0 16px rgba(255,93,115,.4)}
.mcell img{width:60px;height:60px}
.mcell .nm2{font-size:16px;margin-top:5px}
.mcell .stt{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.45;min-height:32px}
.mcell.dead{filter:grayscale(1) brightness(.4);pointer-events:none}
.mcell.fly{animation:fly 1s ease-in forwards}
@keyframes fly{to{transform:translate(130vw,-70vh) rotate(720deg);opacity:0}}
nav{display:flex;background:#0d1330;border-top:2px solid #223066;padding:7px 7px calc(7px + env(safe-area-inset-bottom));gap:5px}
nav button{flex:1;cursor:pointer;border:none;background:transparent;color:var(--muted);border-radius:13px;padding:7px 2px 5px;
  font-size:12px;font-weight:900;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .ic{font-size:21px;line-height:1}
nav button.on{background:#1a2350;color:var(--neon);box-shadow:0 0 12px rgba(63,249,200,.25) inset}
nav button.locked{color:#5a6785}
nav button.locked::after{content:"🔒";position:absolute;top:0;right:14%;font-size:11px}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(4,8,24,.9);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.obox{background:var(--panel);border:3px solid #2c3a6b;border-radius:26px;padding:24px;max-width:620px;width:100%;text-align:center;animation:pop .2s ease-out;max-height:92vh;overflow:auto}
.obox h3{font-size:23px;margin:0 0 8px}
.obox p{color:var(--muted);line-height:1.7;margin:6px 0 14px;font-size:15px}
.obox img{width:86px;height:86px}
#resultBox h1{font-size:clamp(25px,5vw,40px);margin:0 0 8px;white-space:pre-line}
#resultBox.win h1{color:var(--neon);text-shadow:0 0 22px rgba(63,249,200,.7)}
#resultBox.lose h1{color:var(--danger);text-shadow:0 0 22px rgba(255,93,115,.7)}
#resultSub{font-size:16px;line-height:1.8;margin:10px 0 16px}
.btnRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;background:rgba(10,16,38,.95);
  border:2px solid var(--warn);color:var(--warn);padding:10px 18px;border-radius:14px;font-weight:800;font-size:14.5px;
  display:none;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{display:block;animation:pop .15s ease-out}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="dayPill">Day 1</div>
    <div id="clockPill">08:00</div>
    <div id="statusPill">Crew 5/5</div>
    <div id="crewStrip"></div>
    <button class="hbtn" id="langBtn">中/EN</button>
    <button class="hbtn" id="sndBtn">🔊</button>
  </header>
  <main>
    <section class="panel on" id="p-ship">
      <div id="shipHud">
        <h2 class="pt">🛸 <span data-i18n="shipT"></span></h2>
        <div id="timeBarWrap"><div id="timeBar"></div></div>
      </div>
      <div id="shipWrap">
        <canvas id="shipCv"></canvas>
        <button id="actBtn"><span class="ic" id="actIc">💬</span><span id="actTxt">Talk</span></button>
      </div>
      <div id="hintBar" data-i18n="hintBar"></div>
    </section>
    <section class="panel" id="p-cctv">
      <h2 class="pt">📺 <span data-i18n="cctvT"></span><span class="tip" data-i18n="cctvTip"></span></h2>
      <div id="cctvLayout">
        <div id="cctvTop">
          <canvas id="cctvCv"></canvas>
          <div id="cctvLocked"><div><div class="lk">🔒</div><p data-i18n="secLocked"></p></div></div>
        </div>
        <div id="cctvStrip"></div>
        <div id="cctvLog"></div>
      </div>
    </section>
    <section class="panel" id="p-manual">
      <h2 class="pt">📖 <span data-i18n="manT"></span><span class="tip" data-i18n="manTip"></span></h2>
      <div class="scrollY"><div id="manualGrid"></div></div>
    </section>
    <section class="panel" id="p-talk">
      <h2 class="pt">💬 <span data-i18n="talkT"></span><span class="tip" data-i18n="talkTip"></span></h2>
      <div class="scrollY" id="talkList"></div>
    </section>
  </main>
  <nav>
    <button data-p="ship" class="on"><span class="ic">🛸</span><span data-i18n="nShip"></span></button>
    <button data-p="cctv" id="navCctv"><span class="ic">📺</span><span data-i18n="nCctv"></span></button>
    <button data-p="manual"><span class="ic">📖</span><span data-i18n="nMan"></span></button>
    <button data-p="talk"><span class="ic">💬</span><span data-i18n="nTalk"></span></button>
  </nav>
</div>
<div id="title">
  <canvas id="titleCv"></canvas>
  <div class="inner">
    <h1 id="titleH1"></h1>
    <div class="sub" id="titleSub"></div>
    <button class="bigBtn" id="startBtn">▶ START</button>
    <div style="display:flex;gap:10px">
      <button class="pillBtn" id="langBtn2">中/EN</button>
      <button class="pillBtn" id="howBtn">❓</button>
    </div>
    <div class="hint" id="titleHint"></div>
  </div>
</div>
<div class="overlay" id="howOv">
  <div class="obox"><h3 id="howT"></h3><p id="howP" style="text-align:left"></p><button class="bigBtn gray" id="howOk">OK</button></div>
</div>
<div class="overlay" id="meetOv">
  <div class="obox"><h3 id="meetTitle"></h3><p id="meetSub"></p><div id="meetGrid"></div>
  <div class="btnRow" style="margin-top:16px"><button class="bigBtn gray" id="meetCancel">Cancel</button></div></div>
</div>
<div class="overlay" id="resultOv">
  <div class="obox" id="resultBox"><h1 id="resultTitle"></h1><div id="resultSub"></div><button class="bigBtn" id="againBtn">PLAY AGAIN</button></div>
</div>
<div id="toast"></div>

function doorPoint(r,side){
  if(side==='top')return{x:r.x+r.w/2,y:r.y};
  if(side==='bottom')return{x:r.x+r.w/2,y:r.y+r.h};
  if(side==='left')return{x:r.x,y:r.y+r.h/2};

}
function corridorPt(r,side){
  const d=doorPoint(r,side);
  if(side==='top')return{x:d.x,y:d.y-GY/2};
  if(side==='bottom')return{x:d.x,y:d.y+GY/2};
  if(side==='left')return{x:d.x-GX/2,y:d.y};
  return{x:d.x+GX/2,y:d.y};
}
function sideToward(a,b){
  if(b.row<a.row)return 'top';if(b.row>a.row)return 'bottom';
  if(b.col<a.col)return 'left';if(b.col>a.col)return 'right';return null;
}

  const d1=doorPoint(a,s1),c1=corridorPt(a,s1),d2=doorPoint(b,s2),c2=corridorPt(b,s2);
  const pts=[d1,c1];
  if(Math.abs(c1.x-c2.x)>1&&Math.abs(c1.y-c2.y)>1)pts.push({x:c2.x,y:c1.y});
  pts.push(c2,d2);return pts;
}
/* walkable: room interiors + corridor bands + door circles */
function walkable(p){
  for(const r of RLAYOUT){
    if(p.x>=r.x+16&&p.x<=r.x+r.w-16&&p.y>=r.y+16&&p.y<=r.y+r.h-16)return true;
  }
  for(let k=0;k<2;k++){
    const cy=M+RH+GY/2+k*(RH+GY);
    if(p.y>=cy-GY/2+12&&p.y<=cy+GY/2-12&&p.x>=M+12&&p.x<=WORLD.w-M-12)return true;
    const cx=M+RW+GX/2+k*(RW+GX);
    if(p.x>=cx-GX/2+12&&p.x<=cx+GX/2-12&&p.y>=M+12&&p.y<=WORLD.h-M-12)return true;
  }
  for(const r of RLAYOUT){
    if(r.row>0&&(p.x-doorPoint(r,'top').x)**2+(p.y-r.y)**2<30*30)return true;
    if(r.row<2&&(p.x-doorPoint(r,'bottom').x)**2+(p.y-(r.y+r.h))**2<30*30)return true;
    if(r.col>0&&(p.x-r.x)**2+(p.y-doorPoint(r,'left').y)**2<30*30)return true;
    if(r.col<2&&(p.x-(r.x+r.w))**2+(p.y-doorPoint(r,'right').y)**2<30*30)return true;
  }
  return false;
}

  ctx.fillStyle='#9fdcff';ctx.fillText(label,r.x+25,r.y+27);
}
function drawShipBase(ctx){
  // hull exterior
  ctx.save();
  ctx.shadowColor='rgba(63,249,200,.3)';ctx.shadowBlur=34;
  ctx.fillStyle='#070c1e';rr(ctx,6,6,WORLD.w-12,WORLD.h-12,64);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#2b3c78';ctx.lineWidth=4;rr(ctx,6,6,WORLD.w-12,WORLD.h-12,64);ctx.stroke();
  ctx.strokeStyle='rgba(43,60,120,.45)';ctx.lineWidth=2;rr(ctx,20,20,WORLD.w-40,WORLD.h-40,52);ctx.stroke();
  // panel seams
  ctx.strokeStyle='rgba(43,60,120,.22)';ctx.lineWidth=2;
  for(let x=150;x<WORLD.w-40;x+=270){ctx.beginPath();ctx.moveTo(x,32);ctx.lineTo(x,WORLD.h-32);ctx.stroke()}
  for(let y=150;y<WORLD.h-40;y+=270){ctx.beginPath();ctx.moveTo(32,y);ctx.lineTo(WORLD.w-32,y);ctx.stroke()}
  // corridor floors (thick hallways)
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#0e1733';ctx.lineWidth=86;
  for(let k=0;k<2;k++){const y=M+RH+GY/2+k*(RH+GY);
    ctx.beginPath();ctx.moveTo(M+RW/2,y);ctx.lineTo(WORLD.w-M-RW/2,y);ctx.stroke()}
  for(let k=0;k<2;k++){const x=M+RW+GX/2+k*(RW+GX);
    ctx.beginPath();ctx.moveTo(x,M+RH/2);ctx.lineTo(x,WORLD.h-M-RH/2);ctx.stroke()}
  // corridor edge walls
  ctx.strokeStyle='#233260';ctx.lineWidth=4;
  for(let k=0;k<2;k++){const y=M+RH+GY/2+k*(RH+GY);
    ctx.beginPath();ctx.moveTo(M+RW/2,y-43);ctx.lineTo(WORLD.w-M-RW/2,y-43);ctx.stroke();
    ctx.beginPath();ctx.moveTo(M+RW/2,y+43);ctx.lineTo(WORLD.w-M-RW/2,y+43);ctx.stroke()}
  for(let k=0;k<2;k++){const x=M+RW+GX/2+k*(RW+GX);
    ctx.beginPath();ctx.moveTo(x-43,M+RH/2);ctx.lineTo(x-43,WORLD.h-M-RH/2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+43,M+RH/2);ctx.lineTo(x+43,WORLD.h-M-RH/2);ctx.stroke()}
  // center guide strips
  ctx.strokeStyle='rgba(63,249,200,.15)';ctx.lineWidth=6;ctx.setLineDash([16,14]);
  for(let k=0;k<2;k++){const y=M+RH+GY/2+k*(RH+GY);
    ctx.beginPath();ctx.moveTo(M+RW/2,y);ctx.lineTo(WORLD.w-M-RW/2,y);ctx.stroke()}
  for(let k=0;k<2;k++){const x=M+RW+GX/2+k*(RW+GX);
    ctx.beginPath();ctx.moveTo(x,M+RH/2);ctx.lineTo(x,WORLD.h-M-RH/2);ctx.stroke()}
  ctx.setLineDash([]);
  // engine glow at hull bottom
  for(const ex of [WORLD.w*.32,WORLD.w*.68]){
    const g=.5+.5*Math.sin(perf*2.6+ex);
    ctx.fillStyle='rgba(111,215,255,'+(.12+.22*g)+')';
    ctx.beginPath();ctx.ellipse(ex,WORLD.h-8,46,10,0,0,7);ctx.fill();
  }
}
function drawConsoles(ctx){
  ctx.fillStyle='#1b2650';rr(ctx,SEC_DESK.x-80,SEC_DESK.y-20,160,40,8);ctx.fill();
  ctx.strokeStyle='#3ff9c8';ctx.lineWidth=2.5;ctx.stroke();
  for(let i=0;i<4;i++){
    ctx.fillStyle='rgba(63,249,200,'+(.35+.6*Math.abs(Math.sin(perf*3+i)))+')';
    rr(ctx,SEC_DESK.x-62+i*34,SEC_DESK.y-12,26,22,4);ctx.fill();
  }
  const pulse=.5+.5*Math.sin(perf*4);
  ctx.fillStyle='#3a1020';rr(ctx,BTN_POS.x-22,BTN_POS.y+4,44,20,6);ctx.fill();
  ctx.fillStyle='rgba(255,77,94,'+(.55+.45*pulse)+')';
  ctx.beginPath();ctx.arc(BTN_POS.x,BTN_POS.y,17,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle='rgba(255,77,94,'+(.25+.3*pulse)+')';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(BTN_POS.x,BTN_POS.y,25+pulse*4,0,7);ctx.stroke();
}
function drawBody(ctx,b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.PI/2);
  ctx.globalAlpha=.95;
  drawCrew(ctx,{...b.who,moving:false,phase:0,seed:0},0,0,{scale:.95});
  ctx.restore();ctx.globalAlpha=1;
  ctx.font='15px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💀',b.x+22,b.y-14);
}
function wrapText(ctx,text,maxW){
  const words=LANG==='en'?text.split(' '):[...text];const lines=[];let cur='';
  for(const w of words){const t=cur?cur+(LANG==='en'?' ':'')+w:w;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines.slice(0,4);
}
function drawBubble(ctx,c,sx,sy){
  const b=c.bubble;if(!b||perf>b.until)return;
  ctx.font='700 13px system-ui';
  const lines=wrapText(ctx,b.text,190);
  const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+22,h=lines.length*17+14;
  let bx=sx-w/2,by=sy-h-66;
  bx=Math.max(6,Math.min(bx,WORLD.w-w-6));by=Math.max(6,by);
  ctx.globalAlpha=Math.min(1,(b.until-perf)/.3)*Math.min(1,(perf-b.born)/.15+.01);
  ctx.fillStyle='rgba(240,248,255,.96)';rr(ctx,bx,by,w,h,10);ctx.fill();
  ctx.strokeStyle=c.dark;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx-7,by+h);ctx.lineTo(sx+7,by+h);ctx.lineTo(sx,by+h+10);ctx.closePath();
  ctx.fillStyle='rgba(240,248,255,.96)';ctx.fill();
  ctx.fillStyle='#182048';ctx.textAlign='left';ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,bx+11,by+8+i*17));
  ctx.globalAlpha=1;
}
function drawParticles(ctx,dt){
  S.particles=S.particles.filter(p=>p.life>0);
  for(const p of S.particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }ctx.globalAlpha=1;
}
function spawnBurst(x,y,col){
  for(let i=0;i<26;i++){const a=Math.random()*7,sp=30+Math.random()*90;
    S.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,r:2+Math.random()*3,life:.7+Math.random()*.6,max:1.2,col})}
}
/* ================== SIM ================== */
function say(c,text){c.bubble={text,born:perf,until:perf+4.2};SFX.talk()}
function slotClock(){
  const half=slotHalf(S.slot),startH=half?13:8;
  const mins=Math.floor(startH*60+S.slotT/SLOT_LEN*240);
  return{day:slotDay(S.slot),str:String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')};
}
function addLog(who,roomId){
  const cl=slotClock();
  S.log.unshift({day:cl.day,time:cl.str,who:who.name,room:roomId});
  if(S.log.length>60)S.log.pop();
  renderCctvLog();
}
function genStatements(){
  const s=S.slot,alive=S.crew.filter(c=>c.state==='ok'),st={};
  for(const c of alive){
    const others=alive.filter(x=>x!==c);
    const spot=others.length?others[Math.floor(Math.random()*others.length)]:c;
    const half=slotHalf(s)?'PM':'AM';
    const fb=alive.filter(x=>x!==S.imp);
    const vName=S.lastVictim?S.lastVictim.name:(fb.length?fb[Math.floor(Math.random()*fb.length)].name:'??');
    const pickFrom=a=>a[Math.floor(Math.random()*a.length)];
    const mk=lg=>{
      const pool=(c===S.imp)?(s>=2?T[lg].statImpLie:T[lg].statImpPre)
                            :(S.lastVictim?T[lg].statInnoCrime:T[lg].statInno);
      const rr2=ROOMnL(schedRoom(c,s),lg);
      return fmt(pickFrom(pool),{t:half,r:rr2,r2:rr2,s:spot.name,v:vName});
    };
    st[c.id]={zh:mk('zh'),en:mk('en')};
  }
  S.statements[s]=st;
}
function nextSlot(){
  if(S.slot>=N_SLOTS-1){endGame(false,L('loseTime'));return}
  S.slot++;S.slotT=0;
  genStatements();
  for(const c of S.crew){if(c.state!=='ok')continue;gotoRoom(c,schedRoom(c,S.slot))}
  updateHUD();
}
function innocentsAlive(){return S.crew.filter(c=>c.state==='ok'&&c!==S.imp).length}
function doKill(v){
  v.state='dead';v.route=[];v.bubble=null;
  S.bodies.push({x:v.x,y:v.y,who:v,room:v.area,found:false});
  S.lastVictim=v;S.killCd=KILL_CD[1]+Math.random()*12;S.hunt=null;
  const rs=RLAYOUT.filter(x=>x.id!==S.imp.area);
  gotoRoom(S.imp,rs[Math.floor(Math.random()*rs.length)].id);
  S.imp.fleeT=4.5;
  spawnBurst(v.x,v.y-20,'#ff8ba0');
  if(areaAt(S.player)===v.area){S.flash=.7;SFX.alarm()}
  updateHUD();
  if(innocentsAlive()<=2)endGame(false,L('loseCrew'));
}
function isolatedVictims(){
  const ok=S.crew.filter(c=>c.state==='ok');
  const pArea=areaAt(S.player);
  return ok.filter(c=>c!==S.imp&&c.area&&c.area!=='corridor'
    &&ok.filter(x=>x.area===c.area).length===1&&c.area!==pArea);
}
function updateSim(dt){
  // ---- player ----
  const p=S.player;
  let vx=0,vy=0;
  if(keys['w']||keys['arrowup'])vy-=1;
  if(keys['s']||keys['arrowdown'])vy+=1;
  if(keys['a']||keys['arrowleft'])vx-=1;
  if(keys['d']||keys['arrowright'])vx+=1;
  if(joy){vx+=joy.dx/52;vy+=joy.dy/52}
  const mag=Math.hypot(vx,vy);
  if(mag>.12){
    vx/=Math.max(1,mag);vy/=Math.max(1,mag);
    const sp=205*dt;
    const tryMove=(dx,dy)=>{
      const nx=p.x+dx,ny=p.y+dy;
      if(walkable({x:nx,y:ny})){p.x=nx;p.y=ny;return true}return false;
    };
    if(!tryMove(vx*sp,vy*sp)){if(!tryMove(vx*sp,0))tryMove(0,vy*sp)}
    p.moving=true;p.phase+=dt;if(Math.abs(vx)>.1)p.dir=vx>0?1:-1;
  }else p.moving=false;
  p.x=Math.max(8,Math.min(WORLD.w-8,p.x));p.y=Math.max(8,Math.min(WORLD.h-8,p.y));

  // ---- impostor kill AI ----
  if(S.imp.state==='ok'){
    S.killCd-=dt;
    if(S.hunt){
      const t=S.hunt.target;
      const othersIn=t.area&&t.area!=='corridor'
        &&S.crew.filter(x=>x.state==='ok'&&x!==t&&x!==S.imp&&x.area===t.area).length===0;
      const playerIn=areaAt(S.player)===t.area;
      const stillOk=t.state==='ok'&&othersIn&&!playerIn;
      if(!stillOk||playerIn){
        S.hunt=null;S.killCd=Math.max(S.killCd,12);
        if(S.imp.area!=='corridor'&&!S.imp.route.length)gotoRoom(S.imp,schedRoom(S.imp,S.slot));
      }else if(S.imp.area===t.area&&t.area!=='corridor'){
        S.killT+=dt;
        if(S.killT>2.2)doKill(t);
      }else{
        S.killT=0;
        if(!S.imp.route.length&&S.imp.area!=='corridor')gotoRoom(S.imp,t.area);
      }
    }else if(S.killCd<=0){
      const targets=isolatedVictims();
      if(targets.length){
        let t=targets[0],bs=-1;
        for(const x of targets){const sc=Math.hypot(S.player.x-x.x,S.player.y-x.y)+Math.random()*260;if(sc>bs){bs=sc;t=x}}
        S.hunt={target:t};S.killT=0;gotoRoom(S.imp,t.area);
      }else S.killCd=3;
    }
  }
  if(S.meetingCd>0)S.meetingCd-=dt;

  // ---- crew movement ----
  // pair chats: two crew in same room near each other stop and chat
  for(let i=0;i<S.crew.length;i++)for(let j=i+1;j<S.crew.length;j++){
    const a=S.crew[i],b=S.crew[j];
    if(a.state==='ok'&&b.state==='ok'&&!a.chatT&&!b.chatT&&a.workT<=0&&b.workT<=0
      &&a.area===b.area&&a.area!=='corridor'&&Math.hypot(a.x-b.x,a.y-b.y)<95&&Math.random()<dt*.4){
      a.chatT=b.chatT=2.4;a.route=[];b.route=[];
      a.dir=a.x<b.x?1:-1;b.dir=-a.dir;
    }
  }
  for(const c of S.crew){
    if(c.state!=='ok')continue;
    if(c.fleeT>0)c.fleeT-=dt;
    if(c.chatT>0){c.chatT-=dt;c.moving=false;continue}
    if(c.workT>0){c.workT-=dt;c.moving=false;if(c.bubble&&perf>c.bubble.until)c.bubble=null;continue}
    if(c.bubble&&perf>c.bubble.until)c.bubble=null;
    if(c.route.length){
      const tgt=c.route[c.ri],dx=tgt.x-c.x,dy=tgt.y-c.y,d=Math.hypot(dx,dy);
      const sp=118*(c.spd||1)*((c.fleeT>0)?1.35:1)*dt;
      if(d<sp){c.x=tgt.x;c.y=tgt.y;c.ri++;if(c.ri>=c.route.length){c.route=[];c.moving=false}}
      else{c.x+=dx/d*sp;c.y+=dy/d*sp;c.moving=true;if(Math.abs(dx)>2)c.dir=dx>0?1:-1;c.phase+=dt}
    }else{
      c.moving=false;c.wanderT-=dt;
      if(c.wanderT<=0){
        c.wanderT=1.4+Math.random()*2.8;
        const cur=c.area&&c.area!=='corridor'?c.area:null;
        const home=schedRoom(c,S.slot);
        const roll=Math.random();
        const stayP=c===S.imp?.45:.6, roamP=c===S.imp?.4:.2;
        if(cur&&roll<stayP){
          if(Math.random()<.22){c.workT=1.6+Math.random()*2.2;c.wanderT=c.workT+.5}
          else{c.route=[randIn(roomById(cur))];c.ri=0}
        }
        else if(roll<stayP+roamP){
          const others=RLAYOUT.filter(x=>x.id!==cur);
          gotoRoom(c,others[Math.floor(Math.random()*others.length)].id);
        }else gotoRoom(c,home);
      }
    }
    const a=areaAt(c);
    if(a!==c.area){
      if(a!=='corridor'&&c.area&&c.area!=='corridor')addLog(c,a);
      c.area=a;
    }
    if(a!=='corridor'){
      for(const b of S.bodies){
        if(!b.found&&b.room===a){
          b.found=true;
          S.banner={text:fmt(L('crewReport'),{c:c.name,v:b.who.name})};S.bannerT=perf+5;
          SFX.discover();
          gotoRoom(c,schedRoom(c,S.slot));c.fleeT=2;
          setTimeout(()=>{if(S&&S.started&&!S.over&&!S.paused)callMeeting('report')},1500);
        }
      }
    }
  }
  // ---- body discovery ----
  const pArea=areaAt(S.player);
  for(const b of S.bodies){
    if(!b.found&&b.room===pArea){
      b.found=true;SFX.discover();S.flash=.5;
      S.banner={text:fmt(L('bodyFound'),{n:b.who.name})};S.bannerT=perf+6;
      updateHUD();
    }
  }
  // ---- clock ----
  S.slotT+=dt;
  if(S.slotT>=SLOT_LEN)nextSlot();
  if(S.flash>0)S.flash=Math.max(0,S.flash-dt*1.2);
  if(S.banner&&perf>S.bannerT)S.banner=null;
}

/* ================== SHIP RENDER ================== */
const shipCv=$('#shipCv'),cctvCv=$('#cctvCv'),titleCv=$('#titleCv');
function fitCanvas(cv){
  const dpr=Math.min(2,devicePixelRatio||1);
  const w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  return{ctx:cv.getContext('2d'),w,h,dpr};
}
let CAM={zoom:1.6,camX:0,camY:0};
function renderShip(){
  const{ctx,w,h,dpr}=fitCanvas(shipCv);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#070b1d';ctx.fillRect(0,0,w,h);
  const zoom=Math.max(1.3,Math.min(1.8,w/640));
  const vw=w/zoom,vh=h/zoom;
  const camX=Math.max(0,Math.min(Math.max(0,WORLD.w-vw),S.player.x-vw/2));
  const camY=Math.max(0,Math.min(Math.max(0,WORLD.h-vh),S.player.y-vh/2));
  CAM={zoom,camX,camY};
  ctx.save();ctx.translate(-camX*zoom,-camY*zoom);ctx.scale(zoom,zoom);
  drawShipBase(ctx);
  for(const r of RLAYOUT)drawRoomFloor(ctx,r);
  drawConsoles(ctx);
  for(const b of S.bodies)drawBody(ctx,b);
  drawParticles(ctx,1/60);
  const it=nearestInteract();
  if(it&&it.type==='crew'){
    ctx.strokeStyle='rgba(255,209,102,.9)';ctx.lineWidth=2.5;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.arc(it.obj.x,it.obj.y-22,34+Math.sin(perf*4)*3,0,7);ctx.stroke();ctx.setLineDash([]);
  }else if(it&&it.type==='btn'){
    ctx.strokeStyle='rgba(255,77,94,.95)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(BTN_POS.x,BTN_POS.y,26+Math.sin(perf*5)*4,0,7);ctx.stroke();
  }else if(it&&it.type==='body'){
    ctx.strokeStyle='rgba(255,138,160,.9)';ctx.lineWidth=2.5;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.arc(it.obj.x,it.obj.y,34,0,7);ctx.stroke();ctx.setLineDash([]);
  }
  const ents=[];
  for(const c of S.crew)if(c.state==='ok')ents.push({y:c.y,draw:()=>drawCrew(ctx,c,c.x,c.y,{name:true})});
  ents.push({y:S.player.y,draw:()=>drawRobot(ctx,S.player.x,S.player.y,{moving:S.player.moving,phase:S.player.phase,name:true})});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
  for(const c of S.crew){
    if(c.state!=='ok')continue;
    let ic=null;
    if(c.chatT>0)ic='💬';
    else if(c.workT>0)ic=(c.seed%2<1)?'🔧':'💭';
    if(ic){ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(ic,c.x+18+Math.sin(perf*3)*2,c.y-86)}
  }
  for(const c of S.crew)if(c.state==='ok'&&c.bubble)drawBubble(ctx,c,c.x,c.y);
  ctx.restore();
  if(S.flash>0){ctx.fillStyle='rgba(255,60,90,'+(S.flash*.35)+')';ctx.fillRect(0,0,w,h)}
  if(S.banner){
    ctx.font='800 14.5px system-ui';
    const tw=Math.min(w-24,ctx.measureText(S.banner.text).width+30);
    ctx.fillStyle='rgba(255,93,115,.94)';rr(ctx,(w-tw)/2,10,tw,32,12);ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(S.banner.text,w/2,26,tw-16);
  }
  const cl=slotClock();
  ctx.font='800 12px ui-monospace,monospace';ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillStyle='rgba(111,215,255,.9)';ctx.fillText('D'+cl.day+' '+(slotHalf(S.slot)?'PM':'AM')+' '+cl.str,w-10,8);
  // minimap: rooms + player only (no crew!)
  const mmW=168,mmH=mmW*WORLD.h/WORLD.w,mmX=12,mmY=h-mmH-12;
  ctx.fillStyle='rgba(6,10,26,.85)';rr(ctx,mmX-6,mmY-6,mmW+12,mmH+12,10);ctx.fill();
  ctx.strokeStyle='#2a3a74';ctx.lineWidth=2;ctx.stroke();
  const mms=mmW/WORLD.w;
  for(const r of RLAYOUT){
    ctx.fillStyle=r.id==='security'?'rgba(63,249,200,.3)':'rgba(42,58,116,.55)';
    ctx.fillRect(mmX+r.x*mms,mmY+r.y*mms,r.w*mms,r.h*mms);
  }
  ctx.font='11px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('📺',mmX+(SECURITY.x+SECURITY.w/2)*mms,mmY+(SECURITY.y+SECURITY.h/2)*mms);
  ctx.fillText('🚨',mmX+(COCKPIT.x+COCKPIT.w/2)*mms,mmY+(COCKPIT.y+COCKPIT.h/2)*mms);
  ctx.fillStyle='#3ff9c8';ctx.beginPath();
  ctx.arc(mmX+S.player.x*mms,mmY+S.player.y*mms,4.5+Math.sin(perf*5)*1.3,0,7);ctx.fill();
  if(joy){
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(joy.sx,joy.sy,52,0,7);ctx.stroke();
    ctx.fillStyle='rgba(63,249,200,.5)';
    ctx.beginPath();ctx.arc(joy.sx+joy.dx,joy.sy+joy.dy,24,0,7);ctx.fill();
  }
}

/* ================== CCTV ================== */
function camOverlay(ctx,vx,vy,vw,vh,r){
  ctx.save();ctx.beginPath();ctx.rect(vx,vy,vw,vh);ctx.clip();
  ctx.fillStyle='rgba(0,0,0,.16)';
  for(let y=vy;y<vy+vh;y+=4)ctx.fillRect(vx,y,vw,1.4);
  const g=ctx.createRadialGradient(vx+vw/2,vy+vh/2,vh*.34,vx+vw/2,vy+vh/2,vh*.85);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=g;ctx.fillRect(vx,vy,vw,vh);
  if(Math.random()<.14){ctx.fillStyle='rgba(160,255,210,.05)';
    for(let i=0;i<5;i++)ctx.fillRect(vx+Math.random()*vw,vy+Math.random()*vh,Math.random()*40,1.6)}
  ctx.restore();
  ctx.strokeStyle='#1f8a6d';ctx.lineWidth=2.5;rr(ctx,vx,vy,vw,vh,10);ctx.stroke();
  ctx.font='800 11px ui-monospace,monospace';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#54ffb8';
  const cl=slotClock();
  ctx.fillText('CAM-'+String(RLAYOUT.indexOf(r)+1).padStart(2,'0')+' '+r.ic+r[LANG],vx+8,vy+6);
  ctx.textAlign='right';ctx.fillText(cl.str,vx+vw-30,vy+6);
  if(Math.sin(perf*4)>0){ctx.fillStyle='#ff4d5e';ctx.beginPath();ctx.arc(vx+vw-16,vy+11,3.5,0,7);ctx.fill();
    ctx.textAlign='right';ctx.fillStyle='#ff8ba0';ctx.fillText('REC',vx+vw-24,vy+6)}
}
function renderCamView(ctx,vx,vy,vw,vh,r){
  ctx.save();ctx.beginPath();ctx.rect(vx,vy,vw,vh);ctx.clip();
  const pad=8,sc=Math.min((vw-pad*2)/r.w,(vh-pad*2)/r.h);
  ctx.translate(vx+(vw-r.w*sc)/2-r.x*sc,vy+(vh-r.h*sc)/2-r.y*sc);
  ctx.scale(sc,sc);
  ctx.fillStyle='#04140f';ctx.fillRect(r.x-90,r.y-90,r.w+180,r.h+180);
  drawRoomFloor(ctx,r);
  const inRoom=S.crew.filter(c=>c.state==='ok'&&c.area===r.id).sort((a,b)=>a.y-b.y);
  for(const c of inRoom)drawCrew(ctx,c,c.x,c.y,{name:true});
  if(areaAt(S.player)===r.id)drawRobot(ctx,S.player.x,S.player.y,{moving:S.player.moving,phase:S.player.phase});
  for(const b of S.bodies)if(b.room===r.id)drawBody(ctx,b);
  ctx.restore();
  camOverlay(ctx,vx,vy,vw,vh,r);
}
function renderCctv(){
  const{ctx,w,h,dpr}=fitCanvas(cctvCv);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#03080c';ctx.fillRect(0,0,w,h);
  renderCamView(ctx,4,4,w-8,h-8,RLAYOUT[camSel]);
}
let stripCvs=[];
function buildStrip(){
  const el=$('#cctvStrip');el.innerHTML='';stripCvs=[];
  RLAYOUT.forEach((r,i)=>{
    const b=document.createElement('canvas');b.width=152;b.height=94;
    b.style.cssText='flex:0 0 auto;border-radius:10px;cursor:pointer;border:2.5px solid '+(i===camSel?'var(--neon)':'#1f4a3d');
    b.onclick=()=>{camSel=i;SFX.cam();buildStrip()};
    el.appendChild(b);stripCvs.push({cv:b,r});
  });
}
function drawStrip(){for(const st of stripCvs)renderCamView(st.cv.getContext('2d'),0,0,152,94,st.r)}
function renderCctvLog(){
  const el=$('#cctvLog');if(!S){el.innerHTML='';return}
  el.innerHTML=S.log.map(e=>'<div><span class="t">[D'+e.day+' '+e.time+']</span>'+fmt(L('logEnter'),{w:e.who,r:ROOMn(e.room)})+'</div>').join('')||'<div style="opacity:.5">—</div>';
}
/* ================== DOM PANELS ================== */
function updateHUD(){
  $('#dayPill').textContent=fmt(L('day'),{d:slotDay(S.slot)});
  const ok=S.crew.filter(c=>c.state==='ok').length;
  $('#statusPill').textContent=fmt(L('crewN'),{n:ok});
  $('#statusPill').style.color=ok<=3?'var(--danger)':'var(--neon)';
  $('#crewStrip').innerHTML=S.crew.map(c=>'<div class="mini '+(c.state!=='ok'?'gone':'')+'" title="'+c.name+'"><img src="'+(c.png||(c.png=avatarPNG(c)))+'" style="width:34px;height:34px" alt=""></div>').join('');
}
function renderManual(){
  $('#manualGrid').innerHTML=S.crew.map(c=>'<div class="mcard"><img src="'+(c.png||(c.png=avatarPNG(c)))+'" alt="">'
    +'<div style="flex:1"><div class="nm" style="color:'+c.color+'">'+c.name+'</div>'
    +'<div class="rt">'+L('trait')[c.id]+'<br>☀️ '+L('am')+'：<b>'+ROOMn(c.morning)+'</b><br>🌙 '+L('pm')+'：<b>'+ROOMn(c.afternoon)+'</b></div></div></div>').join('');
}
function renderTalk(){
  const slots=Object.keys(S.statements).map(Number).sort().slice(-3);
  $('#talkList').innerHTML=slots.map(s=>{
    const rows=S.crew.map(c=>{
      const txt=S.collected[s+':'+c.id];
      const dead=c.state!=='ok';
      return '<div class="bubble '+(dead?'dead':'')+'"><img src="'+(c.png||(c.png=avatarPNG(c)))+'" alt="">'
        +'<div class="txt"><div class="who2" style="color:'+c.color+'">'+c.name
        +(dead?' <span style="font-size:11px">'+(c.state==='dead'?L('gone'):L('ejected'))+'</span>':'')+'</div>'
        +(txt||(dead?'':'<i style="color:var(--muted)">'+L('notAsked')+'</i>'))+'</div></div>';
    }).join('');
    return '<div class="dayTag">🗓 '+fmt(L('day'),{d:slotDay(s)})+' '+(slotHalf(s)?L('pm'):L('am'))+'</div>'+rows;
  }).join('');
}
function renderMeetGrid(){
  $('#meetGrid').innerHTML=S.crew.map(c=>{
    const dead=c.state!=='ok';
    const st=dead?'':(S.collected[S.slot+':'+c.id]||'');
    const tag=dead?(c.state==='dead'?L('gone'):L('ejected')):'';
    return '<div class="mcell '+(dead?'dead':'')+'" data-id="'+c.id+'"><img src="'+(c.png||(c.png=avatarPNG(c)))+'" alt="">'
      +'<div class="nm2" style="color:'+c.color+'">'+c.name+'</div>'
      +'<div class="stt">'+(dead?tag:(st?st.substring(0,52):L('notAsked')))+'</div></div>';
  }).join('');
  $$('#meetGrid .mcell').forEach(el=>{
    el.onclick=()=>{
      $$('#meetGrid .mcell').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      const c=S.crew.find(x=>x.id===el.dataset.id);
      setTimeout(()=>confirmEject(c,el),260);
    };
  });
}
function refreshI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=L(el.dataset.i18n));
  $('#startBtn').textContent=L('start');$('#againBtn').textContent=L('again');
  $('#meetTitle').textContent=L('meetTitle');$('#meetSub').innerHTML=L('meetSub');
  $('#meetCancel').textContent=L('meetCancel');$('#howT').textContent=L('howT');$('#howP').innerHTML=L('howP');
  $('#titleH1').innerHTML=L('titleH1');$('#titleSub').innerHTML=L('titleSub');$('#titleHint').textContent=L('titleHint');
  if(S){updateHUD();renderManual();renderTalk();renderCctvLog();buildStrip()}
}

/* ================== INPUT / INTERACT ================== */
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let joy=null;
function shipWorld(ev){
  const r=shipCv.getBoundingClientRect();
  const px=ev.clientX-r.left,py=ev.clientY-r.top;
  return{x:CAM.camX+px/CAM.zoom,y:CAM.camY+py/CAM.zoom,sx:px,sy:py};
}
shipCv.addEventListener('pointerdown',ev=>{
  if(!S||S.over||S.paused)return;
  try{shipCv.setPointerCapture(ev.pointerId)}catch(e){}
  const p=shipWorld(ev);
  joy={id:ev.pointerId,sx:p.sx,sy:p.sy,dx:0,dy:0,tap:{x:p.x,y:p.y,t:performance.now()}};
});
shipCv.addEventListener('pointermove',ev=>{
  if(!joy||ev.pointerId!==joy.id)return;
  const r=shipCv.getBoundingClientRect();
  let dx=ev.clientX-r.left-joy.sx,dy=ev.clientY-r.top-joy.sy;
  const d=Math.hypot(dx,dy);
  if(d>52){dx=dx/d*52;dy=dy/d*52}
  joy.dx=dx;joy.dy=dy;
});
function endJoy(ev){
  if(!joy||ev.pointerId!==joy.id)return;
  const moved=Math.hypot(joy.dx,joy.dy);
  const dtms=performance.now()-joy.tap.t;
  if(moved<10&&dtms<450)tryInteractAt(joy.tap);
  joy=null;
}
function cancelJoy(ev){
  if(!joy||ev.pointerId!==joy.id)return;
  joy=null;
}
function clearInput(){
  Object.keys(keys).forEach(k=>keys[k]=false);
  joy=null;
}
shipCv.addEventListener('pointerup',endJoy);
shipCv.addEventListener('pointercancel',cancelJoy);
shipCv.addEventListener('lostpointercapture',cancelJoy);
addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
function crewNear(x,y,rad=42){
  let best=null,bd=rad;
  for(const c of S.crew){if(c.state!=='ok')continue;
    const d=Math.hypot(c.x-x,c.y-y+18);if(d<bd){bd=d;best=c}}
  return best;
}
function nearestInteract(){
  if(!S||S.over||S.paused)return null;
  const p=S.player;
  if(Math.hypot(BTN_POS.x-p.x,BTN_POS.y-p.y)<80)return{type:'btn'};
  for(const b of S.bodies)if(Math.hypot(b.x-p.x,b.y-p.y)<86)return{type:'body',obj:b};
  const c=crewNear(p.x,p.y,88);
  if(c)return{type:'crew',obj:c};
  return null;
}
function tryInteractAt(p){
  const c=crewNear(p.x,p.y,60);
  if(c&&Math.hypot(c.x-S.player.x,c.y-S.player.y)<130){talkTo(c);return}
  if(Math.hypot(BTN_POS.x-p.x,BTN_POS.y-p.y)<55&&Math.hypot(BTN_POS.x-S.player.x,BTN_POS.y-S.player.y)<130){callMeeting('btn');return}
  for(const b of S.bodies)if(Math.hypot(b.x-p.x,b.y-p.y)<65&&Math.hypot(b.x-S.player.x,b.y-S.player.y)<130){callMeeting('body',b);return}
}
function talkTo(c){
  const st=(S.statements[S.slot]||{})[c.id];
  if(st){S.collected[S.slot+':'+c.id]=st[LANG];say(c,st[LANG]);renderTalk()}
  else say(c,'…');
}
function callMeeting(src){
  if(src==='btn'&&S.meetingCd>0){toast(fmt(L('meetCdToast'),{s:Math.ceil(S.meetingCd)}));return}
  S.paused=true;SFX.meeting();
  renderMeetGrid();
  $('#meetOv').classList.add('on');
}
$('#meetCancel').onclick=()=>{S.paused=false;$('#meetOv').classList.remove('on');SFX.beep()};
function confirmEject(c,cell){
  if(!c||c.state!=='ok')return;
  const q=LANG==='zh'?('确定把 '+c.name+' 弹出气闸吗？'):('Eject '+c.name+'?');
  if(!window.confirm(q))return;
  $('#meetOv').classList.remove('on');
  doEject(c,cell);
}
function doEject(c,cell){
  SFX.eject();
  if(cell)cell.classList.add('fly');
  setTimeout(()=>{
    if(c===S.imp){c.state='ejected';endGame(true,c)}
    else{
      c.state='ejected';c.route=[];
      SFX.bad();
      S.bodies=[];S.meetingCd=22;S.paused=false;
      updateHUD();renderTalk();
      if(innocentsAlive()<=2)endGame(false,L('loseCrew'));
    }
  },950);
}
function endGame(win,detail){
  S.over=true;S.paused=true;amb(false);
  const box=$('#resultBox');
  box.classList.toggle('win',win);box.classList.toggle('lose',!win);
  $('#resultTitle').textContent=win?L('winT'):L('loseT');
  $('#resultSub').innerHTML=win?fmt(L('winSub'),{n:detail.name,c:detail.color})
    :fmt(L('loseSub'),{n:S.imp.name,c:S.imp.color,r:detail||''});
  if(win)SFX.good();else SFX.lose();
  $('#resultOv').classList.add('on');
}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);
}

/* ================== NAV / BUTTONS ================== */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.p==='cctv'&&(!S||areaAt(S.player)!=='security')){toast(L('secLocked').replace(/<br>/g,' '));SFX.bad();return}
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    $('#p-'+b.dataset.p).classList.add('on');
    if(b.dataset.p==='cctv'){SFX.cam();buildStrip()}
    else SFX.beep();
    if(b.dataset.p==='manual')renderManual();
    if(b.dataset.p==='talk')renderTalk();
  };
});
$('#actBtn').onclick=()=>{
  const it=nearestInteract();if(!it)return;
  if(it.type==='crew')talkTo(it.obj);
  else if(it.type==='btn')callMeeting('btn');
  else if(it.type==='body')callMeeting('body');
};
function updateActBtn(){
  const it=nearestInteract(),btn=$('#actBtn');
  if(!it){btn.style.display='none';return}
  btn.style.display='flex';
  if(it.type==='crew'){$('#actIc').textContent='💬';$('#actTxt').innerHTML=L('actTalk')}
  else if(it.type==='btn'){$('#actIc').textContent='🚨';$('#actTxt').innerHTML=L('actBtn')}
  else{$('#actIc').textContent='📋';$('#actTxt').innerHTML=L('actBody')}
}
function toggleLang(){LANG=LANG==='zh'?'en':'zh';try{localStorage.setItem('jensonLang',LANG)}catch(e){}refreshI18n();SFX.beep()}
$('#langBtn').onclick=toggleLang;$('#langBtn2').onclick=toggleLang;
$('#sndBtn').onclick=()=>{sndOn=!sndOn;$('#sndBtn').textContent=sndOn?'🔊':'🔇';if(sndOn){SFX.beep();amb(S&&S.started&&!S.over)}else amb(false)};
$('#startBtn').onclick=()=>{
  ac().resume&&ac().resume();
  $('#title').style.display='none';
  SFX.good();amb(true);
  newGame();S.started=true;
  updateHUD();renderManual();renderTalk();buildStrip();renderCctvLog();
};
$('#againBtn').onclick=()=>{
  $('#resultOv').classList.remove('on');SFX.beep();amb(true);
  newGame();S.started=true;
  updateHUD();renderManual();renderTalk();buildStrip();renderCctvLog();
};
$('#howBtn').onclick=()=>{$('#howOv').classList.add('on');SFX.beep()};
$('#howOk').onclick=()=>{$('#howOv').classList.remove('on');SFX.beep()};

/* ================== TITLE ================== */
function renderTitle(){
  const{ctx,w,h,dpr}=fitCanvas(titleCv);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#fff';
  for(let i=0;i<70;i++){ctx.globalAlpha=.2+.6*Math.abs(Math.sin(perf+i));ctx.fillRect((i*971)%w,(i*613)%h,2,2)}
  ctx.globalAlpha=1;
  BASE_CREW.forEach((bc,i)=>{
    const x=((perf*46+i*(w/5+140))%(w+160))-80,y=h*.84;
    drawCrew(ctx,{...bc,moving:true,dir:1,phase:perf+i*2,seed:i,state:'ok'},x,y,{scale:1.25,name:true});
  });
  drawRobot(ctx,((perf*46+2.5*(w/5+140))%(w+160))-80,h*.84,{moving:true,phase:perf,scale:1.25,name:true});
}

/* ================== MAIN LOOP ================== */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;perf=now/1000;
  if(!S){renderTitle();requestAnimationFrame(loop);return}
  if(S.started&&!S.over&&!S.paused){
    const sub=Math.ceil(dt/.033);
    for(let i=0;i<sub;i++)updateSim(dt/sub);
  }
  $('#timeBar').style.width=Math.min(100,S.slotT/SLOT_LEN*100)+'%';
  const cl=slotClock();const cp=$('#clockPill');
  if(cp.textContent!==cl.str)cp.textContent=cl.str;
  const inSec=areaAt(S.player)==='security';
  $('#cctvLocked').classList.toggle('on',!inSec);
  $('#navCctv').classList.toggle('locked',!inSec);
  const active=document.querySelector('.panel.on');
  if(active){
    if(active.id==='p-ship'){renderShip();updateActBtn()}
    else if(active.id==='p-cctv'&&inSec){renderCctv();drawStrip()}
  }
  if($('#title').style.display!=='none')renderTitle();
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{if(S&&S.started)buildStrip()});
refreshI18n();
requestAnimationFrame(loop);
</script>
