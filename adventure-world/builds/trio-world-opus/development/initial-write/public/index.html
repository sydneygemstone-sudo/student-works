<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>三人同乐世界</title>
<style>
  :root { --panel: rgba(20,28,48,.72); --line: rgba(255,255,255,.14); --gold:#ffd66b; --ok:#7ee08a; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#87ceeb; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color:#fff; user-select:none; }
  canvas { display:block; }
  .panel { background: var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#6ec6ff 0%,#9be7a0 60%,#ffe29a 100%); z-index:50; }
  #start .card { width:min(460px,92vw); padding:28px; text-align:center; background:rgba(255,255,255,.92); color:#223; border-radius:22px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
  #start h1 { margin:0 0 6px; font-size:34px; letter-spacing:2px; }
  #start p { margin:0 0 18px; color:#556; }
  #start input { width:100%; font-size:20px; padding:12px 14px; border-radius:12px; border:2px solid #cfd8ea; outline:none; text-align:center; }
  #start input:focus { border-color:#4a90e2; }
  .skins { display:flex; gap:8px; justify-content:center; margin:16px 0; flex-wrap:wrap; }
  .skins button { font-size:15px; padding:8px 10px; border-radius:12px; border:2px solid #dde; background:#fff; cursor:pointer; }
  .skins button.on { border-color:#4a90e2; background:#e8f2ff; }
  #go { width:100%; font-size:22px; padding:14px; border:0; border-radius:14px; background:#ff7a59; color:#fff; font-weight:700; cursor:pointer; box-shadow:0 6px 0 #d85b3c; }
  #go:active { transform:translateY(3px); box-shadow:0 3px 0 #d85b3c; }
  .keys { margin-top:16px; font-size:13px; color:#667; line-height:1.8; }
  kbd { background:#eef; border:1px solid #ccd; border-bottom-width:2px; border-radius:5px; padding:0 6px; font-family:inherit; color:#334; }
  #hud { position:fixed; inset:0; pointer-events:none; display:none; }
  #zone { position:absolute; left:16px; top:14px; padding:10px 16px; font-size:18px; font-weight:700; }
  #zone small { display:block; font-weight:400; font-size:13px; opacity:.85; }
  #online { position:absolute; left:16px; top:86px; padding:8px 14px; font-size:13px; line-height:1.7; }
  #quest { position:absolute; right:16px; top:14px; width:300px; padding:14px 16px; }
  #quest h3 { margin:0 0 8px; font-size:15px; color:var(--gold); display:flex; justify-content:space-between; }
  #qnow { font-size:18px; font-weight:700; line-height:1.4; }
  #qhint { font-size:13px; opacity:.85; margin-top:4px; }
  #qdist { margin-top:8px; font-size:14px; color:var(--gold); }
  #qlist { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; font-size:12.5px; line-height:1.75; max-height:180px; overflow:hidden; }
  #qlist .done { color:var(--ok); opacity:.8; } #qlist .cur { color:#fff; font-weight:700; } #qlist .todo { opacity:.45; }
  #inv { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:8px; padding:8px 10px; }
  .chip { min-width:56px; text-align:center; padding:6px 8px; border-radius:10px; background:rgba(255,255,255,.1); font-size:18px; }
  .chip b { font-size:14px; margin-left:4px; }
  #powers { position:absolute; left:16px; bottom:16px; display:flex; gap:8px; }
  .pw { width:74px; padding:8px 4px; text-align:center; font-size:12px; position:relative; overflow:hidden; }
  .pw .ic { font-size:24px; display:block; } .pw .k { position:absolute; left:6px; top:4px; font-size:11px; opacity:.8; }
  .pw .cd { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); height:0; }
  #prompt { position:absolute; left:50%; top:60%; transform:translateX(-50%); padding:10px 18px; font-size:18px; font-weight:700; display:none; }
  #prompt kbd { font-size:18px; }
  #toast { position:absolute; left:50%; top:18%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .t { padding:10px 20px; font-size:20px; font-weight:700; animation: pop .35s ease-out; }
  @keyframes pop { from { transform:scale(.6); opacity:0 } to { transform:scale(1); opacity:1 } }
  #banner { position:absolute; left:50%; top:10px; transform:translateX(-50%); padding:8px 18px; background:#e0524a; border-radius:10px; display:none; font-weight:700; }
  #help { position:absolute; right:16px; bottom:16px; padding:8px 12px; font-size:12px; line-height:1.8; opacity:.9; }
  #chatlog { position:absolute; left:16px; bottom:120px; width:320px; font-size:14px; line-height:1.6; text-shadow:0 1px 2px #000; }
  #chatin { position:absolute; left:16px; bottom:96px; width:320px; font-size:15px; padding:6px 10px; border-radius:8px; border:0; display:none; pointer-events:auto; }
  #fade { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; z-index:40; }
  @media (max-width: 760px) { #quest { width:220px; } #help, #chatlog { display:none; } }
</style>
</head>
<body>
<div id="start"><div class="card">
  <h1>🌈 三人同乐世界</h1>
  <p>大厅 · 主题乐园 · 野外生存区 · 快乐农场</p>
  <input id="name" maxlength="10" placeholder="输入你的名字">
  <div class="skins" id="skinPick"></div>
  <button id="go">进入世界 ▶</button>
  <div class="keys"><kbd>W A S D</kbd> 走路 · <kbd>鼠标拖动</kbd> 转视角 · <kbd>空格</kbd> 跳（可二段跳）<br><kbd>Shift</kbd> 跑 · <kbd>E</kbd> 互动 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 超能力 · <kbd>C</kbd> 换角色 · <kbd>T</kbd> 聊天</div>
</div></div>

<div id="hud">
  <div id="zone" class="panel">中央大厅<small>☀️ 晴天</small></div>
  <div id="online" class="panel"></div>
  <div id="quest" class="panel"><h3><span>📜 任务指引</span><span id="qnum"></span></h3><div id="qnow"></div><div id="qhint"></div><div id="qdist"></div><div id="qlist"></div></div>
  <div id="powers">
    <div class="pw panel" id="pw1"><span class="k">1</span><span class="ic">🚀</span>超级跳<div class="cd"></div></div>
    <div class="pw panel" id="pw2"><span class="k">2</span><span class="ic">⚡</span>闪电冲刺<div class="cd"></div></div>
    <div class="pw panel" id="pw3"><span class="k">3</span><span class="ic">🕊️</span>飞行<div class="cd"></div></div>
  </div>
  <div id="inv" class="panel"></div>
  <div id="prompt" class="panel"></div>
  <div id="toast"></div>
  <div id="banner">⚠️ 连接断开，正在重连…</div>
  <div id="chatlog"></div>
  <input id="chatin" maxlength="60" placeholder="说点什么，回车发送">
  <div id="help" class="panel"><kbd>WASD</kbd>走 <kbd>空格</kbd>跳 <kbd>Shift</kbd>跑 <kbd>E</kbd>互动<br><kbd>1/2/3</kbd>超能力 <kbd>C</kbd>换角色 <kbd>T</kbd>聊天 <kbd>滚轮</kbd>缩放</div>
</div>
<div id="fade"></div>

<script type="module">
import * as THREE from './vendor/three.module.js';

// ================= 基础 =================
const $ = (id) => document.getElementById(id);
const SKINS = [
  { name: '蓝色小勇士', body: 0x4a90e2, head: 0xffd9b3, leg: 0x2c3e70, extra: 'helmet' },
  { name: '忍者', body: 0x2a2a35, head: 0x2a2a35, leg: 0x1a1a22, extra: 'band' },
  { name: '宇航员', body: 0xf2f2f2, head: 0xf2f2f2, leg: 0xdddddd, extra: 'visor' },
  { name: '小熊', body: 0xa0703f, head: 0xa0703f, leg: 0x7a5230, extra: 'bear' },
  { name: '粉粉兔', body: 0xffb3d1, head: 0xfff0f6, leg: 0xff8fbf, extra: 'bunny' },
];
let mySkin = 0;
try { mySkin = +(localStorage.getItem('tw_skin') || 0) % SKINS.length; $('name').value = localStorage.getItem('tw_name') || ''; } catch {}
SKINS.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.name; b.onclick = () => { mySkin = i; renderSkinPick(); }; $('skinPick').appendChild(b); });
function renderSkinPick() { [...$('skinPick').children].forEach((b, i) => b.classList.toggle('on', i === mySkin)); }
renderSkinPick();

// ================= 声音（零资源，Web Audio 合成） =================
let AC = null;
function tone(f, d = 0.12, type = 'sine', v = 0.15, f2 = null, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d = 0.3, v = 0.2, lp = 1200) {
  if (!AC) return; const n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), a = buf.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v;
  s.buffer = buf; s.connect(f).connect(g).connect(AC.destination); s.start();
}
const SFX = {
  jump: () => tone(420, .12, 'square', .06, 720),
  djump: () => tone(620, .14, 'square', .06, 1100),
  pick: () => { tone(880, .08, 'triangle', .15); tone(1320, .12, 'triangle', .12, null, .07); },
  star: () => [988, 1319, 1568, 1976].forEach((f, i) => tone(f, .12, 'triangle', .12, null, i * .06)),
  power: () => { tone(200, .4, 'sawtooth', .08, 1200); noise(.3, .08, 3000); },
  dash: () => noise(.35, .18, 2500),
  fly: () => tone(300, .6, 'sine', .12, 900),
  fire: () => { noise(.8, .25, 800); tone(120, .5, 'sawtooth', .05, 60); },
  moo: () => tone(160, .6, 'sawtooth', .08, 110),
  cluck: () => { tone(900, .05, 'square', .06, 600); tone(900, .05, 'square', .06, 600, .1); },
  baa: () => tone(420, .45, 'sawtooth', .06, 380),
  build: () => { noise(.08, .3, 600); noise(.08, .3, 600); setTimeout(() => noise(.08, .3, 600), 150); },
  quest: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .14, null, i * .1)),
  portal: () => tone(300, .5, 'sine', .15, 1500),
  deny: () => tone(220, .18, 'square', .06, 160),
  pad: () => tone(200, .35, 'sine', .15, 900),
  chat: () => tone(1200, .06, 'sine', .08),
};

// ================= 渲染器 / 场景 =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe3ff, 60, 220);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hemi = new THREE.HemisphereLight(0xdff1ff, 0x6a8f4e, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dd, 2.2); sun.position.set(40, 70, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 200 }); sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// 渐变天空
const skyU = { top: { value: new THREE.Color(0x4aa3ff) }, bot: { value: new THREE.Color(0xdff3ff) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*1.6+0.1,0.0,1.0); gl_FragColor = vec4(mix(bot,top,h),1.0); }' }));
scene.add(sky);

const M = {}; // 材质缓存
function mat(c, o = {}) { const k = c + JSON.stringify(o); return M[k] || (M[k] = new THREE.MeshStandardMaterial({ color: c, roughness: .85, flatShading: true, ...o })); }
function mesh(geo, c, x = 0, y = 0, z = 0, o) { const m = new THREE.Mesh(geo, typeof c === 'number' ? mat(c, o) : c); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; }
function label(text, { bg = 'rgba(20,28,48,.8)', fg = '#fff', size = 48, scale = 1 } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d'); g.font = `bold ${size}px -apple-system, "PingFang SC", sans-serif`;
  const w = Math.ceil(g.measureText(text).width) + size; c.width = w; c.height = size * 1.6;
  g.font = `bold ${size}px -apple-system, "PingFang SC", sans-serif`; g.fillStyle = bg; const r = size * .5;
  g.beginPath(); g.roundRect(0, 0, w, c.height, r); g.fill(); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, fog: false })); s.scale.set(w / c.height * scale, scale, 1); return s;
}

// ================= 世界布局 =================
const ZONES = [
  { key: 'hub', name: '🏛️ 中央大厅', c: new THREE.Vector3(0, 0, 0), r: 24 },
  { key: 'park', name: '🎡 主题乐园', c: new THREE.Vector3(0, 0, -85), r: 34 },
  { key: 'wild', name: '🌲 野外生存区', c: new THREE.Vector3(-85, 0, 0), r: 34 },
  { key: 'farm', name: '🐮 快乐农场', c: new THREE.Vector3(85, 0, 0), r: 34 },
];
const colliders = []; // {x,z,r}
const ground = mesh(new THREE.CircleGeometry(160, 64), 0x7cc36b); ground.rotation.x = -Math.PI / 2; ground.castShadow = false; scene.add(ground);
function disc(x, z, r, c, y = 0.02) { const d = mesh(new THREE.CircleGeometry(r, 48), c, x, y, z); d.rotation.x = -Math.PI / 2; d.castShadow = false; scene.add(d); return d; }
function path(x1, z1, x2, z2, w = 6) { const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz); const p = mesh(new THREE.BoxGeometry(w, .06, L), 0xe8d9b0, (x1 + x2) / 2, .03, (z1 + z2) / 2); p.rotation.y = Math.atan2(dx, dz); p.castShadow = false; scene.add(p); }
path(0, -20, 0, -55); path(-20, 0, -55, 0); path(20, 0, 55, 0);
disc(0, 0, 24, 0xe9e2d0); disc(0, 0, 21, 0xf5efe0, .03);
disc(0, -85, 34, 0xa6e3a1); disc(-85, 0, 34, 0x5f9e4f); disc(85, 0, 34, 0xb5d77a);

// 大厅：喷泉 + 路牌 + 传送门
const fountain = new THREE.Group(); scene.add(fountain);
fountain.add(mesh(new THREE.CylinderGeometry(5, 5.4, 1, 24), 0xcfd8e3, 0, .5, 0));
const water = mesh(new THREE.CylinderGeometry(4.5, 4.5, .2, 24), 0x5ec8ff, 0, 1, 0, { roughness: .1, metalness: .1, transparent: true, opacity: .85 }); fountain.add(water);
fountain.add(mesh(new THREE.CylinderGeometry(.6, .9, 3.5, 12), 0xcfd8e3, 0, 2.5, 0));
fountain.add(mesh(new THREE.SphereGeometry(1.1, 16, 12), 0x5ec8ff, 0, 4.4, 0, { roughness: .1, transparent: true, opacity: .8 }));
colliders.push({ x: 0, z: 0, r: 5.6 });
const hubSign = label('🏛️ 中央大厅 · 三人同乐世界', { scale: 2.2 }); hubSign.position.set(0, 8, 0); scene.add(hubSign);

const portals = [];
function portal(x, z, color, text, dest, face) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = face;
  const ring = mesh(new THREE.TorusGeometry(2.6, .35, 12, 32), color, 0, 2.9, 0, { emissive: color, emissiveIntensity: .6 });
  const inner = new THREE.Mesh(new THREE.CircleGeometry(2.4, 32), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .35, side: THREE.DoubleSide })); inner.position.y = 2.9;
  g.add(ring, inner); const l = label(text, { scale: 1.3 }); l.position.y = 6.4; g.add(l); scene.add(g);
  portals.push({ pos: new THREE.Vector3(x, 0, z), dest, inner, ring });
}
portal(0, -19, 0xff6fb5, '传送 → 🎡 主题乐园', new THREE.Vector3(0, 0, -60), 0);
portal(-19, 0, 0x3ecf6e, '传送 → 🌲 野外生存区', new THREE.Vector3(-60, 0, 0), Math.PI / 2);
portal(19, 0, 0xffb238, '传送 → 🐮 快乐农场', new THREE.Vector3(60, 0, 0), Math.PI / 2);
portal(0, -56, 0x7fb2ff, '回到 🏛️ 大厅', new THREE.Vector3(0, 0, -14), 0);
portal(-56, 0, 0x7fb2ff, '回到 🏛️ 大厅', new THREE.Vector3(-14, 0, 0), Math.PI / 2);
portal(56, 0, 0x7fb2ff, '回到 🏛️ 大厅', new THREE.Vector3(14, 0, 0), Math.PI / 2);

function arch(x, z, rotY, color, text) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY;
  g.add(mesh(new THREE.BoxGeometry(.8, 6, .8), color, -4, 3, 0), mesh(new THREE.BoxGeometry(.8, 6, .8), color, 4, 3, 0), mesh(new THREE.BoxGeometry(9.6, 1, 1), color, 0, 6.2, 0));
  const l = label(text, { scale: 1.8 }); l.position.y = 7.8; g.add(l); scene.add(g);
  colliders.push({ x: x + Math.cos(rotY) * -4, z: z - Math.sin(rotY) * -4, r: .7 }, { x: x + Math.cos(rotY) * 4, z: z - Math.sin(rotY) * 4, r: .7 });
}
arch(0, -50, 0, 0xff6fb5, '🎡 主题乐园'); arch(-50, 0, Math.PI / 2, 0x3ecf6e, '🌲 野外生存区'); arch(50, 0, Math.PI / 2, 0xffb238, '🐮 快乐农场');

// 装饰树
function tree(x, z, s = 1, leaf = 0x3f9e4a, collide = true) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
  g.add(mesh(new THREE.CylinderGeometry(.35, .5, 2.4, 7), 0x8a5a35, 0, 1.2, 0));
  g.add(mesh(new THREE.IcosahedronGeometry(1.9, 0), leaf, 0, 3.6, 0), mesh(new THREE.IcosahedronGeometry(1.4, 0), leaf, .6, 4.8, .3));
  scene.add(g); if (collide) colliders.push({ x, z, r: .7 * s }); return g;
}
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rng(42);
for (let i = 0; i < 70; i++) { const a = R() * Math.PI * 2, d = 128 + R() * 25; tree(Math.cos(a) * d, Math.sin(a) * d, 1.2 + R() * 1.2, [0x3f9e4a, 0x4fae5a, 0x2f8a40][i % 3], false); }
for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + .3; const x = Math.cos(a) * 30, z = Math.sin(a) * 30; if (Math.abs(x) > 5 && Math.abs(z) > 5) tree(x, z, 1, 0x5cb85c); }

// 云
const clouds = [];
for (let i = 0; i < 14; i++) { const g = new THREE.Group(); for (let j = 0; j < 4; j++) g.add(mesh(new THREE.IcosahedronGeometry(3 + R() * 3, 1), 0xffffff, j * 4 - 6, R() * 2, R() * 3, { emissive: 0xffffff, emissiveIntensity: .25 })); g.position.set(R() * 300 - 150, 45 + R() * 20, R() * 300 - 150); g.children.forEach(c => c.castShadow = false); scene.add(g); clouds.push(g); }

// ---------- 主题乐园 ----------
const PK = ZONES[1].c;
const wheel = new THREE.Group(); wheel.position.set(PK.x + 14, 13, PK.z - 14); scene.add(wheel);
const wheelSpin = new THREE.Group(); wheel.add(wheelSpin);
wheelSpin.add(mesh(new THREE.TorusGeometry(10, .35, 8, 48), 0xff5e7e));
const cabins = [];

function animateChar(c, anim, t, speed = 1) {

}
