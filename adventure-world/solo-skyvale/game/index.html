<!doctype html><html lang="zh-CN"><head><script src="../../../shared/hub-r6/strings.js"></script><script src="../../../shared/hub-r6/game-runtime.js"></script><script src="../../../shared/hub-r6/touch-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#b6e4ed"><title>Skyvale · 云间奇遇</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css?v=ipad-hud-1"><link rel="stylesheet" href="./ipad.css?v=ipad-hud-1"><style>html,body{overscroll-behavior:none}canvas{touch-action:none}input,select,textarea{font-size:16px!important}.panel,.card{max-width:100%}#roomLabel,#invite,#chatin,#tChat{display:none!important}</style></head><body><main id="game-shell">
<div id="scene"></div><div id="vignette"></div>
<header><div class="brand"><b>SKYVALE<span>✦</span></b><small>云间奇遇 · 单人冒险</small></div><div class="top"><span id="network">正在准备世界</span><button id="invite">邀请伙伴 ↗</button><button id="sound" aria-label="声音">♫</button><button id="full" aria-label="全屏">⛶</button></div></header>
<section id="quest" class="glass"><small>我们的冒险</small><h2 id="questTitle">点亮云间小岛</h2><p id="questText">独自探索三片天地。</p><div class="progress"><i id="progressFill"></i></div><div id="badges">☆ 乐园　 ♧ 营地　 ⌂ 农场</div></section>
<aside id="map" class="glass"><small>ISLAND MAP</small><canvas width="180" height="150" id="mapCanvas"></canvas><span id="weather">☀ 晴朗</span></aside>
<div id="team"></div><div id="toast" role="status"></div><div id="waypoint"></div>
<div id="bottom"><div class="glass location"><small id="zone">CENTRAL PLAZA</small><b id="zoneName">星光大厅</b><span id="bag">🍎 0　 🧺 0</span></div><div class="hint">WASD / 方向键移动 · 拖动画面转视角 · 空格跳跃</div></div>
<div id="joystick"><span></span><small>移动</small></div><div id="actions"><button id="interact" class="primary">✦ 互动 <small>E</small></button><button id="ability">✧ 飞行 <small>F</small></button><button id="jump">↑ 跳跃 <small>SPACE</small></button><button id="power">切换能力</button><button id="skin">换角色</button><button id="home">回大厅</button></div>
<div id="join" class="overlay"><div class="joinCard"><div class="eyebrow">A LITTLE WORLD. A BIG ADVENTURE.</div><h1>云间奇遇</h1><p>飞过星环，点亮篝火，建造我们的家。<br>独自探索三片天地。</p><div class="characters"><button data-skin="0" class="selected">🧑‍🚀<span>星空探险家</span></button><button data-skin="1">🧚<span>花园精灵</span></button><button data-skin="2">🦊<span>森林游侠</span></button></div><label>你的昵称<input id="nickname" maxlength="16" placeholder="探险家" autocomplete="off"></label><label>本机独立进度<input id="room" maxlength="16" autocomplete="off" spellcheck="false"></label><button id="start">开始单人冒险 →</button><p id="joinStatus">浏览器单人试玩 · 本机自动保存</p></div><div class="previewLabel">01 / 主题乐园　　02 / 野外营地　　03 / 暖阳农场</div></div>
</main><script type="module" src="./game.js?v=ipad-hud-1"></script></body></html>
